name: Vérifier les stocks Pokémon 30 ans
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pokemon-30-check
  cancel-in-progress: false
jobs:
  verifier-et-publier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Contrôle des offres et alertes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python surveillance.py
      - name: Conserver l'état des stocks pour éviter les alertes répétées
        run: |
          git config user.name 'pokemon30-bot'
          git config user.email 'pokemon30-bot@users.noreply.github.com'
          git add offres.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation des stocks Pokémon 30 ans'
            git push
          fi
      - name: Préparer le site public
        run: |
          mkdir -p public
          cp index.html offres.json produits.json public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Publier le comparateur
        id: deployment
        uses: actions/deploy-pages@v4
